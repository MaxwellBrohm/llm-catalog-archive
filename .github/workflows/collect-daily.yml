name: collect-daily
on:
  schedule: [{ cron: '20 0 * * *' }]
  workflow_dispatch:
concurrency: { group: collector-archive, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    # A hung fetch must not sit on the write token, and the concurrency group
    # serialises this job against the fast tier: a run that never ends blocks
    # every later run too.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # --ignore-scripts: install lifecycle scripts would otherwise run with the
      # push credential sitting in .git/config. Nothing here needs them.
      - run: npm ci --ignore-scripts
      - name: Identify the committer
        run: |
          # The canonical Actions bot identity. NOT
          # <name>@users.noreply.github.com: that pre-2017 form carries no
          # numeric account id, so GitHub resolves it at DISPLAY time to
          # whoever holds the username. Nobody holds llm-catalog-archive
          # today, but if anyone registers it every commit this workflow
          # ever made would render under their account and avatar, and R7
          # forbids rewriting to fix it.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: npx tsx src/cli.ts --tier daily
        env: { LCA_BRANCH: main }
      # AFTER the fetch, so it scores against the capture this run just stored
      # rather than yesterday's. The accuracy ledger's only writer: it appends a
      # claim for every expiration_date the catalogue announces and a resolution
      # once a capture taken AFTER that date exists to check it against. Append
      # only, and it exits 0 with nothing to say on a quiet day.
      - name: Score the catalogue's own predictions
        run: npx tsx src/ledger-cli.ts
        env: { LCA_BRANCH: main }
      # The read surface is NOT regenerated or committed here any more.
      #
      # It is a pure function of the history this job just appended to, so
      # committing it stored the same facts twice and dropped generated pages
      # into a history R7 forbids rewriting. Worse, every regenerated file was a
      # conflict waiting for the next push. .github/workflows/pages.yml rebuilds
      # and deploys it, triggered by this workflow's completion.

  # A FAILED RUN MUST LEAVE A TRACE A HUMAN SEES.
  #
  # Without this, a collector that starts failing produces a red tick in the
  # Actions tab that nobody is watching, and the archive simply stops growing.
  # The liveness workflow catches a prolonged outage on its own schedule; this
  # catches the FIRST failure, on the run that failed, while it is still one
  # failure rather than a fortnight of them.
  notify:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="The \`${{ github.workflow }}\` collector run failed.

          Run: $RUN_URL

          The archive stops growing while this is broken. If the failure persists,
          .github/workflows/liveness.yml will escalate on its own schedule, and past
          60 days of repository inactivity GitHub disables the schedules entirely."
          existing="$(gh issue list --label collector-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create collector-failure --description 'A scheduled collector run failed' --color D93F0B 2>/dev/null || true
            gh issue create --title 'Collector: a scheduled run failed' --label collector-failure --body "$body"
          fi
