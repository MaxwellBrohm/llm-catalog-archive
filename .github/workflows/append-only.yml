name: append-only
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The guard itself lives in tools/append-only.sh so that test/append-only.test.ts
      # can execute it against real temporary repositories. As inline shell here it was
      # unreachable from the suite, and two mutations that disabled it entirely left
      # every test green.
      - name: Ledgers may only gain lines
        run: tools/append-only.sh "${{ github.event.before || 'HEAD~1' }}"
